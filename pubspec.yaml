name: front_mailclient
description: "Private mail client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.5.0
  google_fonts: ^6.3.1
  flutter_widget_from_html_core: ^0.17.0
  file_picker: ^10.3.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  web: ^1.1.1
  pdfrx: ^2.6.5
  archive: ^4.3.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.svg
    - assets/brand/ibelucky_2026_logo.png
